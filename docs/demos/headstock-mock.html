<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { margin: 0; background: #fffaf3; display: flex; align-items: flex-start; gap: 70px; padding: 40px; }
  .wrap { text-align: center; font: 13px sans-serif; color: #888; }
  canvas { display: block; margin: 0 auto 10px; }
  img { display: block; width: 200px; margin: 0 auto 10px; }
</style>
</head>
<body>
  <div class="wrap"><img src="real-headstock.jpg">真实参考(局部)</div>
  <div class="wrap"><canvas id="c"></canvas>第四版(按真图测量)</div>
<script>
// 真图测量基准:
// 高宽比 1.3 / 弦枕端板宽 75% / 弦柱横位 25% 与 75% / 纵位 26%-44%-62%(近枕→远枕)
// 枕端弦距 ≈ 柱端弦距的 60%(内紧外松,扇形向外张) / 远端大圆弧(冠口改浅)
function draw() {
  const cv = document.getElementById('c');
  const W = 150, H = 195, k = 2.2;
  cv.width = W*k; cv.height = H*k; cv.style.width = W+'px'; cv.style.height = H+'px';
  const ctx = cv.getContext('2d');
  ctx.scale(k,k);

  const sil = () => {
    ctx.beginPath();
    // 顶部(弦枕端)宽 75%
    ctx.moveTo(W*0.125, 0);
    ctx.quadraticCurveTo(W/2, -H*0.01, W*0.875, 0);
    // 右肩:到最宽(全宽)在 ~35% 高度
    ctx.bezierCurveTo(W*0.95,H*0.06, W,H*0.18, W,H*0.35);
    ctx.bezierCurveTo(W,H*0.55, W*0.995,H*0.68, W,H*0.8);
    // 远端大圆弧收底(浅冠口)
    ctx.bezierCurveTo(W*0.99,H*0.93, W*0.93,H*0.99, W*0.82,H*0.995);
    ctx.bezierCurveTo(W*0.68,H*1.0, W*0.6,H*0.94, W*0.5,H*0.94);
    ctx.bezierCurveTo(W*0.4,H*0.94, W*0.32,H*1.0, W*0.18,H*0.995);
    ctx.bezierCurveTo(W*0.07,H*0.99, W*0.01,H*0.93, 0,H*0.8);
    // 左侧镜像
    ctx.bezierCurveTo(W*0.005,H*0.68, 0,H*0.55, 0,H*0.35);
    ctx.bezierCurveTo(0,H*0.18, W*0.05,H*0.06, W*0.125, 0);
    ctx.closePath();
  };

  ctx.save();
  ctx.shadowColor='rgba(87,53,14,0.4)'; ctx.shadowBlur=8; ctx.shadowOffsetY=5;
  ctx.fillStyle='#c69d63'; sil(); ctx.fill();
  ctx.restore();
  const wood = ctx.createLinearGradient(0,0,0,H);
  wood.addColorStop(0,'#d9b98c'); wood.addColorStop(0.55,'#c69d63'); wood.addColorStop(1,'#ab8148');
  ctx.fillStyle=wood; sil(); ctx.fill();
  ctx.save(); sil(); ctx.clip();

  ctx.strokeStyle='rgba(110,64,16,0.09)';
  for(let i=0;i<6;i++){ const gx=W*(0.14+i*0.145); ctx.lineWidth=1+(i%3)*0.7;
    ctx.beginPath(); ctx.moveTo(gx,0); ctx.bezierCurveTo(gx+3,H*0.3,gx-3,H*0.6,gx+2,H); ctx.stroke(); }
  const sheen=ctx.createRadialGradient(W/2,H*0.04,0,W/2,H*0.04,W*0.7);
  sheen.addColorStop(0,'rgba(255,244,220,0.28)'); sheen.addColorStop(1,'rgba(255,244,220,0)');
  ctx.fillStyle=sheen; ctx.fillRect(0,0,W,H);

  ctx.font='bold 9px sans-serif'; ctx.textAlign='center';
  ctx.shadowColor='rgba(87,53,14,0.9)'; ctx.shadowOffsetY=0.8;
  ctx.fillStyle='#f3e2bd'; ctx.fillText('橙  月', W/2, H*0.09); ctx.shadowColor='transparent';

  // 弦枕(占顶宽75%同宽) + 槽位:枕端弦距=柱端 60% → 弦枕内聚集
  const nutY=8;
  const nutG=ctx.createLinearGradient(0,nutY,0,nutY+8);
  nutG.addColorStop(0,'#f8efd7'); nutG.addColorStop(1,'#e2d0a4');
  ctx.fillStyle=nutG; ctx.fillRect(W*0.10,nutY,W*0.80,8);
  // 柱端横位:6E/5A/4D 在 25%,3G/2B/1E 在 75%;枕端按60%压缩向中心
  const postX=i=> i<3 ? W*0.25 : W*0.75;
  const postY=[0.62,0.44,0.26,0.26,0.44,0.62].map(p=>H*p);
  const nutX=i=>{ // 向对应侧的柱收 60%:枕位 = 中心 + (柱位-中心)*0.6
    const c=W/2, t=0.6;
    return c+(postX(i)-c)*t;
  };
  ctx.fillStyle='rgba(87,53,14,0.55)';
  for(let i=0;i<6;i++){ ctx.beginPath(); ctx.arc(nutX(i),nutY+4,1.3,0,7); ctx.fill(); }

  // 六弦:枕端 → 斜向外张到柱端(真扇形:内紧外松)
  for(let i=0;i<6;i++){
    const wound=i<3;
    ctx.lineWidth=wound?3.6:2;
    ctx.strokeStyle=wound?'#9a7038':'#b8b8b8';
    ctx.beginPath();
    ctx.moveTo(nutX(i), nutY+8);
    ctx.lineTo(postX(i), postY[i]);
    ctx.stroke();
  }
  for(let i=0;i<6;i++){
    const px=postX(i), py=postY[i];
    const pg=ctx.createRadialGradient(px-3,py-3,1,px,py,8);
    pg.addColorStop(0,'#f5f5f5'); pg.addColorStop(1,'#8a8a8a');
    ctx.fillStyle=pg; ctx.beginPath(); ctx.arc(px,py,8,0,7); ctx.fill();
    ctx.fillStyle='#4a4a4a'; ctx.beginPath(); ctx.arc(px,py,2.2,0,7); ctx.fill();
  }
  ctx.restore();
  ctx.strokeStyle='rgba(87,53,14,0.55)'; ctx.lineWidth=1.6; sil(); ctx.stroke();

  for(let i=0;i<6;i++){
    const py=postY[i], left=i<3;
    const kx= left? -17 : W+17;
    // 旋钮斜向外下(真琴头安装角)
    ctx.save();
    ctx.translate(kx,py);
    ctx.rotate(left? -12*Math.PI/180 : 12*Math.PI/180);
    const g=ctx.createLinearGradient(-12,0,12,0);
    g.addColorStop(0,'#fffdf5'); g.addColorStop(1,'#cbbfa0');
    ctx.fillStyle=g; ctx.strokeStyle='#8d7748'; ctx.lineWidth=2;
    ctx.beginPath();
    if(ctx.roundRect) ctx.roundRect(-12,-11,24,22,7); else ctx.rect(-12,-11,24,22);
    ctx.fill(); ctx.stroke();
    ctx.fillStyle='#5c4a24'; ctx.font='bold 7.5px sans-serif';
    ctx.fillText(['6E','5A','4D','3G','2B','1E'][i], 0, 2.6);
    ctx.restore();
  }
}
draw();
</script>
</body>
</html>
