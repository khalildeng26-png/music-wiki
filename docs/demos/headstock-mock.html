<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { margin: 0; background: #fffaf3; display: flex; align-items: flex-start; gap: 80px; padding: 40px; }
  .wrap { text-align: center; font: 13px sans-serif; color: #888; }
  canvas { display: block; margin: 0 auto 10px; }
</style>
</head>
<body>
  <div class="wrap"><canvas id="c"></canvas>第三版:弦斜张/柱贴边/窄长板</div>
<script>
// 目标解剖(竖立,弦枕在顶):
// - 窄长板(高:宽 ≈ 1.4),肩部外扩、腰部微收、底部圆角+中央冠口
// - 六弦从弦枕槽位「斜向外张」到贴边的弦柱(3+3:6E/1E 最远,4D/3G 最近)
// - 无横向连杆(此前被看成品丝),弦柱即侧边银柱,旋钮在板外
function draw() {
  const cv = document.getElementById('c');
  const W = 150, H = 210, k = 2.2;
  cv.width = W*k; cv.height = H*k; cv.style.width = W+'px'; cv.style.height = H+'px';
  const ctx = cv.getContext('2d');
  ctx.scale(k,k);

  const sil = () => {
    const nw = W*0.17;
    ctx.beginPath();
    ctx.moveTo(nw, 0);
    ctx.quadraticCurveTo(W/2, -H*0.012, W-nw, 0);
    ctx.bezierCurveTo(W*0.925,H*0.018, W*0.965,H*0.075, W*0.98,H*0.17);  // 肩
    ctx.bezierCurveTo(W*0.99,H*0.30, W*0.955,H*0.38, W*0.965,H*0.52);    // 上腰内收
    ctx.bezierCurveTo(W*0.975,H*0.66, W*0.99,H*0.74, W*0.98,H*0.86);     // 下腰外鼓
    ctx.bezierCurveTo(W*0.965,H*0.95, W*0.92,H*0.99, W*0.8,H*0.995);
    ctx.bezierCurveTo(W*0.68,H*1.0, W*0.615,H*0.865, W*0.5,H*0.865);     // 冠口
    ctx.bezierCurveTo(W*0.385,H*0.865, W*0.32,H*1.0, W*0.2,H*0.995);
    ctx.bezierCurveTo(W*0.08,H*0.99, W*0.035,H*0.95, W*0.02,H*0.86);
    ctx.bezierCurveTo(W*0.01,H*0.74, W*0.025,H*0.66, W*0.035,H*0.52);
    ctx.bezierCurveTo(W*0.045,H*0.38, W*0.01,H*0.30, W*0.02,H*0.17);
    ctx.bezierCurveTo(W*0.035,H*0.075, W*0.075,H*0.018, nw, 0);
    ctx.closePath();
  };

  ctx.save();
  ctx.shadowColor='rgba(87,53,14,0.4)'; ctx.shadowBlur=8; ctx.shadowOffsetY=5;
  ctx.fillStyle='#c69d63'; sil(); ctx.fill();
  ctx.restore();
  const wood = ctx.createLinearGradient(0,0,0,H);
  wood.addColorStop(0,'#d9b98c'); wood.addColorStop(0.55,'#c69d63'); wood.addColorStop(1,'#ab8148');
  ctx.fillStyle=wood; sil(); ctx.fill();
  ctx.save(); sil(); ctx.clip();

  ctx.strokeStyle='rgba(110,64,16,0.09)';
  for(let i=0;i<6;i++){ const gx=W*(0.14+i*0.145); ctx.lineWidth=1+(i%3)*0.7;
    ctx.beginPath(); ctx.moveTo(gx,0); ctx.bezierCurveTo(gx+3,H*0.3,gx-3,H*0.6,gx+2,H); ctx.stroke(); }
  const sheen=ctx.createRadialGradient(W/2,H*0.04,0,W/2,H*0.04,W*0.7);
  sheen.addColorStop(0,'rgba(255,244,220,0.28)'); sheen.addColorStop(1,'rgba(255,244,220,0)');
  ctx.fillStyle=sheen; ctx.fillRect(0,0,W,H);

  ctx.font='bold 9px sans-serif'; ctx.textAlign='center';
  ctx.shadowColor='rgba(87,53,14,0.9)'; ctx.shadowOffsetY=0.8;
  ctx.fillStyle='#f3e2bd'; ctx.fillText('橙  月', W/2, H*0.1); ctx.shadowColor='transparent';

  // 弦枕 + 槽位(弦在枕端分布 26%-74%)
  const nutY=8;
  const nutG=ctx.createLinearGradient(0,nutY,0,nutY+8);
  nutG.addColorStop(0,'#f8efd7'); nutG.addColorStop(1,'#e2d0a4');
  ctx.fillStyle=nutG; ctx.fillRect(W*0.08,nutY,W*0.84,8);
  const xs=[26,34.8,43.6,52.4,61.2,70].map(p=>W*p/100);
  ctx.fillStyle='rgba(87,53,14,0.55)';
  xs.forEach(x=>{ctx.beginPath();ctx.arc(x,nutY+4,1.3,0,7);ctx.fill();});

  // 弦柱位:贴边(12%/88%),扇形远近 6E/1E 最远
  const postY=[0.62,0.44,0.26,0.26,0.44,0.62].map(p=>H*p);
  const postX=i=> i<3 ? W*0.12 : W*0.88;

  // 六弦:弦枕槽 → 斜行到弦柱(低三弦古铜粗)
  for(let i=0;i<6;i++){
    const wound=i<3;
    ctx.lineWidth=wound?3.6:2;
    ctx.strokeStyle=wound?'#9a7038':'#b8b8b8';
    ctx.beginPath();
    ctx.moveTo(xs[i], nutY+8);
    ctx.lineTo(postX(i), postY[i]);
    ctx.stroke();
  }
  // 弦柱
  for(let i=0;i<6;i++){
    const px=postX(i), py=postY[i];
    const pg=ctx.createRadialGradient(px-3,py-3,1,px,py,8);
    pg.addColorStop(0,'#f5f5f5'); pg.addColorStop(1,'#8a8a8a');
    ctx.fillStyle=pg; ctx.beginPath(); ctx.arc(px,py,8,0,7); ctx.fill();
    ctx.fillStyle='#4a4a4a'; ctx.beginPath(); ctx.arc(px,py,2.2,0,7); ctx.fill();
  }
  ctx.restore();
  ctx.strokeStyle='rgba(87,53,14,0.55)'; ctx.lineWidth=1.6; sil(); ctx.stroke();

  // 旋钮(板外示意)
  for(let i=0;i<6;i++){
    const py=postY[i], left=i<3;
    const kx= left? -16 : W+16;
    const g=ctx.createLinearGradient(kx-12,0,kx+12,0);
    g.addColorStop(0,'#fffdf5'); g.addColorStop(1,'#cbbfa0');
    ctx.fillStyle=g; ctx.strokeStyle='#8d7748'; ctx.lineWidth=2;
    ctx.beginPath();
    if(ctx.roundRect) ctx.roundRect(kx-12,py-11,24,22,7); else ctx.rect(kx-12,py-11,24,22);
    ctx.fill(); ctx.stroke();
    ctx.fillStyle='#5c4a24'; ctx.font='bold 7.5px sans-serif';
    ctx.fillText(['6E','5A','4D','3G','2B','1E'][i], kx, py+2.6);
  }
}
draw();
</script>
</body>
</html>
