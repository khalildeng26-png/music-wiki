<!doctype html>
<html lang="zh">
  <head>
    <meta charset="utf-8" />
    <title>琴头预览(与小程序同源绘制)</title>
    <style>
      body {
        margin: 0;
        background: #fffaf3;
        font-family: system-ui, sans-serif;
      }
      .row {
        display: flex;
        gap: 24px;
        padding: 24px;
        align-items: flex-start;
      }
      .item {
        text-align: center;
        position: relative;
        display: inline-block;
      }
      canvas {
        display: block;
      }
      .cap {
        color: #8a8a8a;
        font-size: 13px;
        margin-top: 6px;
      }
      h3 {
        margin: 16px 24px 0;
        font-size: 15px;
        color: #212529;
      }
    </style>
  </head>
  <body>
    <h3>琴头预览 —— 与小程序共用 shared/headstock.ts + headstock-paint.ts(几何与绘制同一份)</h3>
    <div class="row" id="row"></div>

    <script type="module">
      import { paintHeadstock, knobLayout } from "/shared/headstock-paint.js";

      const GUITAR = [
        { short: "6E" },
        { short: "5A" },
        { short: "4D" },
        { short: "3G" },
        { short: "2B" },
        { short: "1E" },
      ];
      const UKULELE = [{ short: "4G" }, { short: "3C" }, { short: "2E" }, { short: "1A" }];
      const BASS = [{ short: "4E" }, { short: "3A" }, { short: "2D" }, { short: "1G" }];

      const row = document.getElementById("row");
      for (const [name, strings] of [
        ["吉他", GUITAR],
        ["尤克里里", UKULELE],
        ["贝斯", BASS],
      ]) {
        const wrap = document.createElement("div");
        wrap.className = "item";
        const W = 260;
        const H = W * (strings.length === 6 ? 1.34 : 1.1);
        const cv = document.createElement("canvas");
        cv.width = W * 2;
        cv.height = H * 2;
        cv.style.width = W + "px";
        cv.style.height = H + "px";
        cv.style.display = "block";
        const ctx = cv.getContext("2d");
        ctx.scale(2, 2);
        paintHeadstock(ctx, W, H, strings, { ratio: H / W, k: W / 300 });
        // 旋钮(视图层,小程序里是 WXML 绝对定位)
        for (const kn of knobLayout(strings, W, H)) {
          const d = document.createElement("div");
          d.textContent = kn.short;
          Object.assign(d.style, {
            position: "absolute",
            left: kn.left + "px",
            top: kn.top + "px",
            width: W * 0.22 + "px",
            height: H * 0.085 + "px",
            lineHeight: H * 0.085 + "px",
            textAlign: "center",
            fontSize: "12px",
            fontWeight: "700",
            color: "#5c4a24",
            background: "radial-gradient(circle at 35% 22%, #fffdf5, #e6dcc3 65%, #cbbfa0)",
            border: "2px solid #8d7748",
            borderRadius: "8px",
            transform: `rotate(${kn.tilt}deg)`,
          });
          wrap.appendChild(d);
        }
        wrap.style.position = "relative";
        const cap = document.createElement("div");
        cap.className = "cap";
        cap.textContent = name;
        wrap.appendChild(cap);
        row.appendChild(wrap);
        // canvas 需在旋钮之前插入,旋钮才能叠在琴头上
        wrap.insertBefore(cv, wrap.firstChild);
      }
    </script>
  </body>
</html>
