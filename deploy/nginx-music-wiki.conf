server {
    server_name ambermoon.wiki;

    root /var/www/music-wiki;
    # 静态站 404:回落到站内品牌 404 页
    error_page 404 /404.html;
    index index.html;

    # 静态资源长缓存
    location /_astro/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location /pagefind/ {
        expires 1h;
    }
    location = /favicon.ico { log_not_found off; }

    # 静态站路由:目录式 URL(如 /entries/guitar)回落到 index.html
    location /api/ {
        proxy_pass http://127.0.0.1:8089;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri.html $uri/index.html =404;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/ambermoon.wiki/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/ambermoon.wiki/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot


}
server {
    if ($host = www.ambermoon.wiki) {
        return 301 https://ambermoon.wiki$request_uri;
    } # managed by Certbot


    if ($host = ambermoon.wiki) {
        return 301 https://ambermoon.wiki$request_uri;
    } # managed by Certbot


    listen 80 default_server;
    server_name ambermoon.wiki;
    return 404; # managed by Certbot




}# www → 裸域 301(规范域名,防搜索引擎当两个站分权重)
server {
    server_name www.ambermoon.wiki;
    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/ambermoon.wiki/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ambermoon.wiki/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    return 301 https://ambermoon.wiki$request_uri;
}
