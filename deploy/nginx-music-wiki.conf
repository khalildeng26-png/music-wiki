server {
    listen 80 default_server;
    server_name _;

    root /var/www/music-wiki;
    index index.html;

    # 静态资源长缓存
    location /_astro/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location /pagefind/ {
        expires 1h;
    }
    location = /favicon.ico { log_not_found off; }

    # 静态站路由:目录式 URL(如 /entries/guitar)回落到 index.html
    location / {
        try_files $uri $uri.html $uri/index.html =404;
    }
}
