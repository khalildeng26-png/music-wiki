<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" role="img" aria-label="吉他持琴坐姿:琴体凹口搭在右大腿上,琴颈上扬约30度,背坐直,人放松">
  <!-- 地面 -->
  <line x1="20" y1="292" x2="460" y2="292" stroke="#a1a1aa" stroke-width="2" stroke-linecap="round"/>

  <!-- 凳子 -->
  <rect x="242" y="206" width="96" height="11" rx="4" fill="none" stroke="#a1a1aa" stroke-width="2.5"/>
  <line x1="254" y1="217" x2="254" y2="292" stroke="#a1a1aa" stroke-width="2.5"/>
  <line x1="326" y1="217" x2="326" y2="292" stroke="#a1a1aa" stroke-width="2.5"/>

  <!-- 人:头 -->
  <circle cx="290" cy="78" r="17" fill="#a1a1aa"/>
  <!-- 人:躯干(坐直) -->
  <rect x="272" y="100" width="36" height="108" rx="17" fill="#a1a1aa"/>
  <!-- 人:大腿(向右前,琴搭在上面) -->
  <line x1="282" y1="212" x2="202" y2="222" stroke="#a1a1aa" stroke-width="13" stroke-linecap="round"/>
  <!-- 人:小腿 + 脚 -->
  <line x1="202" y1="222" x2="200" y2="284" stroke="#a1a1aa" stroke-width="11" stroke-linecap="round"/>
  <line x1="200" y1="286" x2="178" y2="286" stroke="#a1a1aa" stroke-width="8" stroke-linecap="round"/>

  <!-- 吉他琴体:下凹大、上凹小,搭在大腿上(同色两椭圆视觉合并) -->
  <ellipse cx="188" cy="192" rx="50" ry="40" fill="#d97706"/>
  <ellipse cx="222" cy="160" rx="31" ry="26" fill="#d97706"/>
  <!-- 音孔 -->
  <circle cx="202" cy="184" r="12" fill="none" stroke="#8f5206" stroke-width="3"/>
  <!-- 琴颈:向左上,约 30° -->
  <line x1="238" y1="142" x2="128" y2="82" stroke="#d97706" stroke-width="9" stroke-linecap="round"/>
  <!-- 琴头 -->
  <rect x="104" y="66" width="28" height="16" rx="4" transform="rotate(-28 118 74)" fill="#d97706"/>
  <!-- 弦(细线示意) -->
  <line x1="150" y1="96" x2="230" y2="140" stroke="#f4c584" stroke-width="1.5"/>

  <!-- 左臂:肩 → 肘 → 扶琴颈 -->
  <polyline points="280,116 224,132 158,102" fill="none" stroke="#a1a1aa" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- 右臂:肩 → 搭在琴体最宽处 -->
  <polyline points="296,118 280,164 232,190" fill="none" stroke="#a1a1aa" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- 30° 角示意:水平虚线 + 角弧 -->
  <line x1="238" y1="142" x2="170" y2="142" stroke="#a1a1aa" stroke-width="1.5" stroke-dasharray="4 4"/>
  <path d="M 196 142 A 42 42 0 0 0 201 122" fill="none" stroke="#a1a1aa" stroke-width="1.5"/>

  <!-- 标注 -->
  <text x="40" y="60" font-size="12" fill="#d97706">琴颈上扬约 30°</text>
  <line x1="98" y1="56" x2="118" y2="72" stroke="#d97706" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="330" y="180" font-size="12" fill="#a1a1aa">背坐直,不驼背</text>
  <text x="60" y="240" font-size="12" fill="#a1a1aa">琴体凹口搭右大腿</text>
  <text x="238" y="268" font-size="12" fill="#a1a1aa">右手臂自然搭琴体最宽处</text>
</svg>
